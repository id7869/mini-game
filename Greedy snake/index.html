<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        #gameCanvas {
            border: 1px solid white;
        }
        
        #gameInfo {
            color: white;
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin-bottom: 10px;
        }
        
        #speedControl {
            color: white;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        #gameOver {
            position: absolute;
            color: red;
            font-size: 72px;
            display: none;
        }
        
        #restartPrompt {
            position: absolute;
            color: white;
            font-size: 36px;
            margin-top: 80px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="gameInfo">
        <div id="score">Score: 0</div>
        <div id="speedDisplay">Speed: 5</div>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="speedControl">
        <span>Speed:</span>
        <input type="range" id="speedSlider" min="1" max="10" value="5">
    </div>
    <div id="gameOver">GAME OVER</div>
    <div id="restartPrompt">Press SPACE to restart</div>

    <script>
        // 游戏配置
        const WINDOW_WIDTH = 800;
        const WINDOW_HEIGHT = 600;
        const CELL_SIZE = 20;
        const CELL_NUMBER_X = WINDOW_WIDTH / CELL_SIZE;
        const CELL_NUMBER_Y = WINDOW_HEIGHT / CELL_SIZE;

        // 颜色定义
        const BLACK = "#000000";
        const GREEN = "#00FF00";
        const RED = "#FF0000";
        const DARK_GREEN = "#00CC00";

        class Snake {
            constructor() {
                // 初始蛇身位置（3个方块）
                this.body = [
                    {x: 5, y: 10},
                    {x: 4, y: 10},
                    {x: 3, y: 10}
                ];
                this.direction = {x: 1, y: 0}; // 初始向右移动
                this.newBlock = false;
            }

            drawSnake(ctx) {
                this.body.forEach((block, index) => {
                    const x = block.x * CELL_SIZE;
                    const y = block.y * CELL_SIZE;
                    
                    // 蛇头使用不同颜色
                    if (index === 0) {
                        ctx.fillStyle = DARK_GREEN;
                    } else {
                        ctx.fillStyle = GREEN;
                    }
                    
                    ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                });
            }

            moveSnake() {
                if (this.newBlock) {
                    // 如果吃到食物，不删除尾部，实现增长
                    const head = {x: this.body[0].x + this.direction.x, y: this.body[0].y + this.direction.y};
                    this.body.unshift(head);
                    this.newBlock = false;
                } else {
                    // 正常移动，删除尾部，添加新头部
                    this.body.pop();
                    const head = {x: this.body[0].x + this.direction.x, y: this.body[0].y + this.direction.y};
                    this.body.unshift(head);
                }
            }

            addBlock() {
                this.newBlock = true;
            }

            checkCollision() {
                // 检查是否撞墙
                if (this.body[0].x < 0 || this.body[0].x >= CELL_NUMBER_X || 
                    this.body[0].y < 0 || this.body[0].y >= CELL_NUMBER_Y) {
                    return true;
                }
                
                // 检查是否撞到自己
                for (let i = 1; i < this.body.length; i++) {
                    if (this.body[i].x === this.body[0].x && this.body[i].y === this.body[0].y) {
                        return true;
                    }
                }
                
                return false;
            }
        }

        class Food {
            constructor() {
                this.randomize();
            }

            drawFood(ctx) {
                ctx.fillStyle = RED;
                ctx.fillRect(this.pos.x * CELL_SIZE, this.pos.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            }

            randomize() {
                this.pos = {
                    x: Math.floor(Math.random() * CELL_NUMBER_X),
                    y: Math.floor(Math.random() * CELL_NUMBER_Y)
                };
            }
        }

        class Game {
            constructor() {
                this.snake = new Snake();
                this.food = new Food();
                this.score = 0;
                this.gameOver = false;
            }

            update() {
                if (!this.gameOver) {
                    this.snake.moveSnake();
                    this.checkCollision();
                    this.checkFail();
                }
            }

            drawElements(ctx) {
                this.food.drawFood(ctx);
                this.snake.drawSnake(ctx);
            }

            checkCollision() {
                // 检查蛇是否吃到食物
                if (this.food.pos.x === this.snake.body[0].x && this.food.pos.y === this.snake.body[0].y) {
                    this.food.randomize();
                    this.snake.addBlock();
                    this.score += 10;
                    document.getElementById('score').textContent = 'Score: ' + this.score;
                    
                    // 确保食物不会出现在蛇身上
                    for (let i = 0; i < this.snake.body.length; i++) {
                        if (this.snake.body[i].x === this.food.pos.x && this.snake.body[i].y === this.food.pos.y) {
                            this.food.randomize();
                        }
                    }
                }
            }

            checkFail() {
                // 检查游戏结束条件
                if (this.snake.checkCollision()) {
                    this.gameOver = true;
                    document.getElementById('gameOver').style.display = 'block';
                    document.getElementById('restartPrompt').style.display = 'block';
                }
            }

            resetGame() {
                this.snake = new Snake();
                this.food = new Food();
                this.score = 0;
                this.gameOver = false;
                document.getElementById('score').textContent = 'Score: 0';
                document.getElementById('gameOver').style.display = 'none';
                document.getElementById('restartPrompt').style.display = 'none';
            }
        }

        // 初始化游戏
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const game = new Game();
        let gameSpeed = 150;

        // 设置速度滑块
        const speedSlider = document.getElementById('speedSlider');
        const speedDisplay = document.getElementById('speedDisplay');

        speedSlider.addEventListener('input', function() {
            const speed = parseInt(this.value);
            speedDisplay.textContent = 'Speed: ' + speed;
            gameSpeed = 200 - speed * 15;
            clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                game.update();
                drawGame();
            }, gameSpeed);
        });

        // 键盘控制
        document.addEventListener('keydown', function(event) {
            if (!game.gameOver) {
                // 控制蛇的方向
                switch(event.key) {
                    case 'ArrowUp':
                        if (game.snake.direction.y !== 1) { // 不能直接向下转
                            game.snake.direction = {x: 0, y: -1};
                        }
                        break;
                    case 'ArrowDown':
                        if (game.snake.direction.y !== -1) { // 不能直接向上转
                            game.snake.direction = {x: 0, y: 1};
                        }
                        break;
                    case 'ArrowRight':
                        if (game.snake.direction.x !== -1) { // 不能直接向左转
                            game.snake.direction = {x: 1, y: 0};
                        }
                        break;
                    case 'ArrowLeft':
                        if (game.snake.direction.x !== 1) { // 不能直接向右转
                            game.snake.direction = {x: -1, y: 0};
                        }
                        break;
                }
            } else {
                // 游戏结束后按空格键重新开始
                if (event.key === ' ') {
                    game.resetGame();
                }
            }
        });

        // 绘制游戏
        function drawGame() {
            // 清除画布
            ctx.fillStyle = BLACK;
            ctx.fillRect(0, 0, WINDOW_WIDTH, WINDOW_HEIGHT);
            
            // 绘制游戏元素
            game.drawElements(ctx);
        }

        // 游戏主循环
        let gameInterval = setInterval(() => {
            game.update();
            drawGame();
        }, gameSpeed);

        // 初始绘制
        drawGame();
    </script>
</body>
</html>
