<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连连看游戏</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            background-color: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(10, 50px);
            grid-template-rows: repeat(8, 50px);
            gap: 2px;
            background-color: #ddd;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .cell {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.2s ease;
        }
        
        .cell:hover {
            background-color: #e6f7ff;
            transform: scale(0.95);
        }
        
        .cell.selected {
            background-color: #bae7ff;
            transform: scale(0.95);
        }
        
        .cell.empty {
            background-color: transparent;
            cursor: default;
        }
        
        .cell.empty:hover {
            background-color: transparent;
            transform: none;
        }
        
        .controls {
            display: flex;
            gap: 10px;
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #1890ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #40a9ff;
        }
        
        .message {
            font-size: 18px;
            font-weight: bold;
            color: #52c41a;
            height: 25px;
        }
        
        .level-indicator {
            font-size: 18px;
            font-weight: bold;
            color: #1890ff;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>连连看游戏</h1>
        
        <div class="header">
            <div class="info">
                <div>关卡: <span id="level">1</span></div>
                <div class="level-indicator">难度: 中等</div>
            </div>
            <div class="info">
                <div>时间: <span id="timer">0</span> 秒</div>
                <div>剩余对数: <span id="pairs">0</span></div>
            </div>
        </div>
        
        <div class="board" id="gameBoard"></div>
        
        <div class="message" id="message"></div>
        
        <div class="controls">
            <button id="nextLevel" style="display: none;">下一关</button>
            <button id="reset">重新开始</button>
        </div>
    </div>

    <script>
        class LinkGame {
            constructor() {
                this.board = [];
                this.rows = 8;
                this.cols = 10;
                this.icons = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯',
                              '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐦', '🦆', '🦅'];
                this.selectedCell = null;
                this.level = 1;
                this.pairsCount = 0;
                this.timer = 0;
                this.timerInterval = null;
                this.gameBoard = document.getElementById('gameBoard');
                this.messageEl = document.getElementById('message');
                
                this.initGame();
                this.setupEventListeners();
            }
            
            initGame() {
                this.clearTimer();
                this.timer = 0;
                document.getElementById('timer').textContent = this.timer;
                this.generateBoard();
                this.renderBoard();
                this.updateInfo();
                this.startTimer();
            }
            
            generateBoard() {
                // 初始化空棋盘
                this.board = Array(this.rows).fill().map(() => Array(this.cols).fill(0));
                
                // 计算图标对数 (为了让游戏有挑战性但不至于太难，我们使用中等密度)
                const totalCells = this.rows * this.cols;
                const pairs = Math.floor(totalCells * 0.4); // 40% 的单元格填充图标
                this.pairsCount = pairs;
                document.getElementById('pairs').textContent = this.pairsCount;
                
                // 创建图标对数组
                let iconPairs = [];
                for (let i = 0; i < pairs; i++) {
                    const icon = this.icons[i % this.icons.length];
                    iconPairs.push(icon, icon);
                }
                
                // 随机打乱图标数组
                this.shuffleArray(iconPairs);
                
                // 尝试放置图标确保无死局
                let success = false;
                let attempts = 0;
                const maxAttempts = 100;
                
                while (!success && attempts < maxAttempts) {
                    // 清空棋盘
                    this.board = Array(this.rows).fill().map(() => Array(this.cols).fill(0));
                    
                    // 创建可放置位置列表
                    let positions = [];
                    for (let row = 0; row < this.rows; row++) {
                        for (let col = 0; col < this.cols; col++) {
                            positions.push({row, col});
                        }
                    }
                    
                    // 随机打乱位置
                    this.shuffleArray(positions);
                    
                    let placedPairs = 0;
                    // 放置图标对
                    for (let i = 0; i < pairs * 2; i += 2) {
                        if (positions.length < 2) break;
                        
                        const pos1 = positions.pop();
                        const pos2 = positions.pop();
                        
                        this.board[pos1.row][pos1.col] = iconPairs[i];
                        this.board[pos2.row][pos2.col] = iconPairs[i + 1];
                        placedPairs++;
                        
                        // 检查当前局面是否仍然有解
                        if (placedPairs > 2 && !this.hasSolution()) {
                            // 如果无解，撤销这次放置
                            this.board[pos1.row][pos1.col] = 0;
                            this.board[pos2.row][pos2.col] = 0;
                            placedPairs--;
                            
                            // 把位置放回队列末尾
                            positions.push(pos1, pos2);
                        }
                    }
                    
                    // 检查是否成功放置了所有图标对
                    if (placedPairs === pairs) {
                        success = true;
                    }
                    
                    attempts++;
                }
                
                // 如果多次尝试后仍然失败，直接放置图标（作为备用方案）
                if (!success) {
                    this.board = Array(this.rows).fill().map(() => Array(this.cols).fill(0));
                    let positions = [];
                    for (let row = 0; row < this.rows; row++) {
                        for (let col = 0; col < this.cols; col++) {
                            positions.push({row, col});
                        }
                    }
                    this.shuffleArray(positions);
                    
                    for (let i = 0; i < pairs * 2; i++) {
                        const pos = positions.pop();
                        this.board[pos.row][pos.col] = iconPairs[i];
                    }
                }
            }
            
            // 检查当前局面是否仍有解
            hasSolution() {
                // 对于图标对数较少的情况，直接认为有解
                if (this.pairsCount <= 2) return true;
                
                // 创建一个临时棋盘用于路径查找
                const tempBoard = this.board.map(row => [...row]);
                
                // 尝试查找所有可能的连接
                for (let row1 = 0; row1 < this.rows; row1++) {
                    for (let col1 = 0; col1 < this.cols; col1++) {
                        if (tempBoard[row1][col1] === 0) continue;
                        
                        for (let row2 = 0; row2 < this.rows; row2++) {
                            for (let col2 = 0; col2 < this.cols; col2++) {
                                if (tempBoard[row2][col2] === 0) continue;
                                
                                // 检查是否是同一图标且不是同一个位置
                                if ((row1 !== row2 || col1 !== col2) && 
                                    tempBoard[row1][col1] === tempBoard[row2][col2]) {
                                    
                                    // 检查是否可以连接
                                    if (this.canConnect(row1, col1, row2, col2)) {
                                        return true;
                                    }
                                }
                            }
                        }
                    }
                }
                
                return false;
            }
            
            shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }
            
            renderBoard() {
                this.gameBoard.innerHTML = '';
                this.gameBoard.style.gridTemplateColumns = `repeat(${this.cols}, 50px)`;
                this.gameBoard.style.gridTemplateRows = `repeat(${this.rows}, 50px)`;
                
                for (let row = 0; row < this.rows; row++) {
                    for (let col = 0; col < this.cols; col++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.row = row;
                        cell.dataset.col = col;
                        
                        if (this.board[row][col] === 0) {
                            cell.classList.add('empty');
                        } else {
                            cell.textContent = this.board[row][col];
                        }
                        
                        this.gameBoard.appendChild(cell);
                    }
                }
            }
            
            setupEventListeners() {
                this.gameBoard.addEventListener('click', (e) => {
                    if (e.target.classList.contains('cell') && 
                        !e.target.classList.contains('empty')) {
                        this.handleCellClick(e.target);
                    }
                });
                
                document.getElementById('nextLevel').addEventListener('click', () => {
                    this.nextLevel();
                });
                
                document.getElementById('reset').addEventListener('click', () => {
                    this.resetGame();
                });
            }
            
            handleCellClick(cell) {
                const row = parseInt(cell.dataset.row);
                const col = parseInt(cell.dataset.col);
                
                // 如果已经选中了一个单元格
                if (this.selectedCell) {
                    const selectedRow = parseInt(this.selectedCell.dataset.row);
                    const selectedCol = parseInt(this.selectedCell.dataset.col);
                    
                    // 点击的是同一个单元格，取消选择
                    if (selectedRow === row && selectedCol === col) {
                        this.selectedCell.classList.remove('selected');
                        this.selectedCell = null;
                        return;
                    }
                    
                    // 检查两个单元格是否可以连接
                    if (this.board[selectedRow][selectedCol] === this.board[row][col] && 
                        this.canConnect(selectedRow, selectedCol, row, col)) {
                        
                        // 消除两个单元格
                        this.removeCells(selectedRow, selectedCol, row, col);
                        
                        // 更新剩余对数
                        this.pairsCount--;
                        document.getElementById('pairs').textContent = this.pairsCount;
                        
                        // 检查是否通关
                        if (this.pairsCount === 0) {
                            this.levelComplete();
                        }
                    }
                    
                    // 取消选择
                    this.selectedCell.classList.remove('selected');
                    this.selectedCell = null;
                } else {
                    // 选中单元格
                    cell.classList.add('selected');
                    this.selectedCell = cell;
                }
            }
            
            canConnect(row1, col1, row2, col2) {
                // 检查是否可以通过0到2个拐点连接两个点
                // 使用广度优先搜索算法
                
                // 检查是否是相邻的（0个拐点）
                if (this.isStraightConnected(row1, col1, row2, col2)) {
                    return true;
                }
                
                // 检查1个拐点的情况
                // 检查从点1向右/左/上/下延伸，然后转向点2
                const directions = [[0, 1], [0, -1], [1, 0], [-1, 0]];
                
                for (const [dr, dc] of directions) {
                    let r = row1 + dr;
                    let c = col1 + dc;
                    
                    // 沿着这个方向一直走，直到边界或遇到障碍
                    while (r >= 0 && r < this.rows && c >= 0 && c < this.cols) {
                        // 如果遇到非空单元格，停止
                        if (this.board[r][c] !== 0) break;
                        
                        // 检查是否可以从这个点直连到目标点
                        if (this.isStraightConnected(r, c, row2, col2)) {
                            return true;
                        }
                        
                        r += dr;
                        c += dc;
                    }
                }
                
                // 检查2个拐点的情况
                return this.canConnectWithTwoTurns(row1, col1, row2, col2);
            }
            
            isStraightConnected(row1, col1, row2, col2) {
                // 检查两点是否可以在一条直线上连接（中间没有障碍）
                if (row1 === row2) {
                    // 同一行
                    const minCol = Math.min(col1, col2);
                    const maxCol = Math.max(col1, col2);
                    
                    for (let col = minCol + 1; col < maxCol; col++) {
                        if (this.board[row1][col] !== 0) {
                            return false;
                        }
                    }
                    return true;
                } else if (col1 === col2) {
                    // 同一列
                    const minRow = Math.min(row1, row2);
                    const maxRow = Math.max(row1, row2);
                    
                    for (let row = minRow + 1; row < maxRow; row++) {
                        if (this.board[row][col1] !== 0) {
                            return false;
                        }
                    }
                    return true;
                }
                return false;
            }
            
            canConnectWithTwoTurns(row1, col1, row2, col2) {
                // 实现两个拐点的连接检查
                
                // 遍历所有可能的第一个拐点
                for (let r1 = 0; r1 < this.rows; r1++) {
                    for (let c1 = 0; c1 < this.cols; c1++) {
                        // 跳过已有图标的单元格
                        if (this.board[r1][c1] !== 0) continue;
                        
                        // 检查第一个拐点是否能与起点直连
                        if (this.isStraightConnected(row1, col1, r1, c1)) {
                            // 遍历所有可能的第二个拐点
                            for (let r2 = 0; r2 < this.rows; r2++) {
                                for (let c2 = 0; c2 < this.cols; c2++) {
                                    // 跳过已有图标的单元格
                                    if (this.board[r2][c2] !== 0) continue;
                                    
                                    // 检查第二个拐点是否能与第一个拐点直连
                                    if (this.isStraightConnected(r1, c1, r2, c2)) {
                                        // 检查第二个拐点是否能与终点直连
                                        if (this.isStraightConnected(r2, c2, row2, col2)) {
                                            return true;
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
                
                return false;
            }
            
            removeCells(row1, col1, row2, col2) {
                // 移除两个单元格的内容
                this.board[row1][col1] = 0;
                this.board[row2][col2] = 0;
                
                // 更新界面
                const cells = document.querySelectorAll('.cell');
                cells.forEach(cell => {
                    const r = parseInt(cell.dataset.row);
                    const c = parseInt(cell.dataset.col);
                    
                    if ((r === row1 && c === col1) || (r === row2 && c === col2)) {
                        cell.classList.add('empty');
                        cell.classList.remove('selected');
                        cell.textContent = '';
                    }
                });
            }
            
            levelComplete() {
                this.clearTimer();
                this.messageEl.textContent = `恭喜通关第 ${this.level} 关！`;
                document.getElementById('nextLevel').style.display = 'block';
            }
            
            nextLevel() {
                this.level++;
                document.getElementById('level').textContent = this.level;
                this.messageEl.textContent = '';
                document.getElementById('nextLevel').style.display = 'none';
                this.initGame();
            }
            
            resetGame() {
                this.level = 1;
                document.getElementById('level').textContent = this.level;
                this.messageEl.textContent = '';
                document.getElementById('nextLevel').style.display = 'none';
                this.initGame();
            }
            
            startTimer() {
                this.clearTimer();
                this.timerInterval = setInterval(() => {
                    this.timer++;
                    document.getElementById('timer').textContent = this.timer;
                }, 1000);
            }
            
            clearTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
            }
            
            updateInfo() {
                document.getElementById('pairs').textContent = this.pairsCount;
            }
        }
        
        // 启动游戏
        window.onload = () => {
            new LinkGame();
        };
    </script>
</body>
</html>
